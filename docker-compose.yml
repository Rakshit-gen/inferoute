# Self-contained quickstart: inferoute routing between two Ollama backends.
# Semantic caching and distributed rate limiting need NuclaDB/Redis running
# alongside this — see README.md for how to point config.json at them.
services:
  ollama-1:
    image: ollama/ollama
    ports: ["11434:11434"]

  ollama-2:
    image: ollama/ollama
    ports: ["11435:11434"]

  inferoute:
    build: .
    ports: ["8081:8081"]
    volumes:
      - ./config.docker.json:/etc/inferoute/config.json:ro
    depends_on: [ollama-1, ollama-2]
